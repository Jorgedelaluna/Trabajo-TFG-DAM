server:
  port: 8080

spring:
  application:
    name: crossfit-manager-app

  datasource:
    url: jdbc:mysql://localhost:3306/crossfit_tfg?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: never

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
